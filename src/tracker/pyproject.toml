[project]
name = "tracker"
version = "0.1.0"
description = "Tracker Lambda - application-tracking HTTP API over the jobs DynamoDB table"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.37",
    "aws-lambda-powertools>=3.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]
